<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Pertemuan Les</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html2canvas untuk mengubah HTML menjadi Gambar -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
        }

        /* 
         * FIX PRESISI TERBAIK UNTUK HTML2CANVAS:
         * 1. Elemen induk (.day-tile) menjadi penampung utama yang relatif.
         * 2. Background lingkaran digambar melalui pseudo-element ::before.
         * 3. Teks angka diberi z-index lebih tinggi (z-10) agar selalu berada di atas lingkaran.
         */
        .day-tile {
            position: relative;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 9999px;
            user-select: none;
        }

        /* Teks tanggal diposisikan secara eksplisit di atas background */
        .day-text {
            position: relative;
            z-index: 10;
        }

        /* Pseudo-element untuk membuat lingkaran highlighter yang presisi */
        .day-tile.is-highlighted::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 9999px;
            z-index: 1;
        }

        /* Opsi variasi warna background via pseudo-element */
        .day-tile.hl-emerald::before { background-color: #a7f3d0; } /* emerald-200 */
        .day-tile.hl-yellow::before  { background-color: #fef08a; } /* yellow-200 */
        .day-tile.hl-rose::before    { background-color: #fecdd3; } /* rose-200 */
        .day-tile.hl-sky::before     { background-color: #bae6fd; } /* sky-200 */
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <!-- Container Utama -->
    <div class="w-full max-w-md bg-white rounded-xl shadow-md p-6 border border-gray-100">
        
        <!-- Area Kalender yang Akan Dijadikan Gambar/Di-share -->
        <div id="calendar-card" class="bg-white p-4 rounded-xl">
            <!-- Judul Bulan & Tahun -->
            <h2 id="month-year-title" class="text-xl font-bold text-gray-800 mb-6"></h2>

            <!-- Header Hari (Minggu - Sabtu) -->
            <div class="grid grid-cols-7 text-center font-medium text-gray-700 text-xs sm:text-sm mb-4 justify-items-center">
                <div>
                    <span class="sm:hidden">Min</span>
                    <span class="hidden sm:block">Minggu</span>
                </div>
                <div>
                    <span class="sm:hidden">Sen</span>
                    <span class="hidden sm:block">Senin</span>
                </div>
                <div>
                    <span class="sm:hidden">Sel</span>
                    <span class="hidden sm:block">Selasa</span>
                </div>
                <div>
                    <span class="sm:hidden">Rab</span>
                    <span class="hidden sm:block">Rabu</span>
                </div>
                <div>
                    <span class="sm:hidden">Kam</span>
                    <span class="hidden sm:block">Kamis</span>
                </div>
                <div>
                    <span class="sm:hidden">Jum</span>
                    <span class="hidden sm:block">Jumat</span>
                </div>
                <div>
                    <span class="sm:hidden">Sab</span>
                    <span class="hidden sm:block">Sabtu</span>
                </div>
            </div>

            <!-- Grid Tanggal -->
            <div id="calendar-days" class="grid grid-cols-7 gap-y-3 text-center text-gray-800 text-sm font-medium justify-items-center">
                <!-- Tanggal di-generate otomatis oleh JS -->
            </div>
        </div>

        <!-- Panel Kontrol Aksi (Tidak Masuk ke dalam Gambar) -->
        <div class="mt-6 border-t pt-4 flex flex-col gap-3">
            <p class="text-xs text-gray-500 text-center">Klik tanggal untuk highlight. Tahan klik (long-press) untuk opsi warna.</p>

            <button onclick="shareToWhatsApp()" class="w-full bg-green-500 hover:bg-green-600 text-white font-semibold py-2.5 px-4 rounded-lg flex items-center justify-center gap-2 transition duration-200">
                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                    <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.705 1.754zm6.097-4.148l.377.224c1.474.874 3.167 1.335 4.891 1.337 5.207 0 9.444-4.237 9.447-9.445.002-2.523-.979-4.894-2.76-6.677-1.782-1.782-4.155-2.763-6.678-2.764-5.208 0-9.444 4.237-9.446 9.446-.001 1.831.523 3.617 1.517 5.176l.248.389-1.006 3.674 3.76-.986z"/>
                </svg>
                Bagikan ke WhatsApp
            </button>

            <button onclick="downloadCalendar()" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-2 px-4 rounded-lg flex items-center justify-center gap-2 transition duration-200 text-sm">
                📥 Download Gambar Kalender
            </button>
        </div>
    </div>

    <script>
        /**
         * =========================================================================
         * PENJELASAN TEKNIS PERBAIKAN OFFLINE BACKGROUND
         * =========================================================================
         * 1. Mengapa sebelumnya lingkaran tergeser?
         *    html2canvas sering kebingungan menghitung margin/padding internal ketika 
         *    background dipasang langsung di elemen yang sama dengan teks yang memakai Flexbox.
         * 
         * 2. Solusi Pseudo-Element (`::before`):
         *    Dengan menaruh background di elemen khusus `::before` yang berukuran 100% (top:0, left:0), 
         *    html2canvas dipaksa menggambar lingkaran tepat menutupi sel seluas 36x36px. 
         *    Teks angka (`.day-text`) kemudian ditaruh di atasnya (`z-index: 10`) secara independen.
         * =========================================================================
         */

        const date = new Date();
        const currentYear = date.getFullYear();
        const currentMonth = date.getMonth();

        const monthNames = [
            "Januari", "Februari", "Maret", "April", "Mei", "Juni", 
            "Juli", "Agustus", "September", "Oktober", "November", "Desember"
        ];

        document.getElementById("month-year-title").innerText = `${monthNames[currentMonth]} ${currentYear}`;
        const calendarDaysContainer = document.getElementById("calendar-days");

        const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
        const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

        let activePicker = null;
        let pressTimer = null;
        let isLongPress = false;

        // Pemetaan kelas CSS untuk warna highlighter
        const highlightClasses = ["hl-emerald", "hl-yellow", "hl-rose", "hl-sky"];

        // Render cell kosong sebelum tanggal 1
        for (let x = 0; x < firstDayIndex; x++) {
            const emptyDiv = document.createElement("div");
            emptyDiv.className = "w-9 h-9";
            calendarDaysContainer.appendChild(emptyDiv);
        }

        // Render Tanggal 1 s/d Selesai
        for (let day = 1; day <= totalDays; day++) {
            const dayDiv = document.createElement("div");
            dayDiv.className = "day-tile cursor-pointer hover:bg-gray-100 transition";

            // Bungkus angka ke dalam span terpisah agar teks tidak mengacak posisi background
            const textSpan = document.createElement("span");
            textSpan.className = "day-text";
            textSpan.innerText = day;
            dayDiv.appendChild(textSpan);

            // Pop-up Color Picker
            const pickerDiv = document.createElement("div");
            pickerDiv.className = "pop-picker hidden absolute -top-12 left-1/2 -translate-x-1/2 flex gap-1.5 p-1.5 bg-white border border-gray-200 shadow-xl rounded-full z-30 transition-all duration-150 transform scale-95 opacity-0";
            
            const colors = [
                { classKey: "hl-emerald", dot: "bg-emerald-400" },
                { classKey: "hl-yellow", dot: "bg-yellow-400" },
                { classKey: "hl-rose", dot: "bg-rose-400" },
                { classKey: "hl-sky", dot: "bg-sky-400" }
            ];

            colors.forEach(c => {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = `w-5 h-5 rounded-full ${c.dot} hover:scale-125 transition-transform duration-100 focus:outline-none`;
                
                btn.onclick = function(e) {
                    e.stopPropagation();
                    applyHighlight(dayDiv, c.classKey);
                    closePicker();
                };
                pickerDiv.appendChild(btn);
            });

            dayDiv.appendChild(pickerDiv);

            // Logika Long Press
            function startPress(e) {
                isLongPress = false;
                pressTimer = setTimeout(() => {
                    isLongPress = true;
                    openPicker(pickerDiv);
                }, 500);
            }

            function cancelPress() {
                clearTimeout(pressTimer);
            }

            dayDiv.addEventListener("mousedown", startPress);
            dayDiv.addEventListener("touchstart", startPress, { passive: true });

            dayDiv.addEventListener("mouseup", cancelPress);
            dayDiv.addEventListener("mouseleave", cancelPress);
            dayDiv.addEventListener("touchend", cancelPress);
            dayDiv.addEventListener("touchcancel", cancelPress);

            // Action Klik Biasa (Default Emerald)
            dayDiv.onclick = function(e) {
                if (e.target.closest(".pop-picker")) return;

                if (isLongPress) {
                    isLongPress = false;
                    return;
                }

                closePicker();
                applyHighlight(dayDiv, "hl-emerald");
            };

            calendarDaysContainer.appendChild(dayDiv);
        }

        // Fungsi Toggle Highlight Menggunakan Pseudo-class
        function applyHighlight(element, targetClass) {
            const currentClass = highlightClasses.find(c => element.classList.contains(c));

            if (currentClass === targetClass) {
                // Hapus highlight
                element.classList.remove("is-highlighted", currentClass, "font-bold", "text-gray-900");
                element.classList.add("hover:bg-gray-100");
            } else {
                // Pasang highlight baru
                element.classList.remove(...highlightClasses, "hover:bg-gray-100");
                element.classList.add("is-highlighted", targetClass, "font-bold", "text-gray-900");
            }
        }

        // Kontrol Animasi Pop-up
        function openPicker(pickerEl) {
            if (activePicker && activePicker !== pickerEl) closePicker();

            activePicker = pickerEl;
            pickerEl.classList.remove("hidden");
            setTimeout(() => {
                pickerEl.classList.remove("scale-95", "opacity-0");
                pickerEl.classList.add("scale-100", "opacity-100");
            }, 10);
        }

        function closePicker() {
            if (!activePicker) return;
            const pickerEl = activePicker;
            pickerEl.classList.remove("scale-100", "opacity-100");
            pickerEl.classList.add("scale-95", "opacity-0");
            
            setTimeout(() => {
                pickerEl.classList.add("hidden");
            }, 150);
            
            activePicker = null;
        }

        document.addEventListener("click", function(e) {
            if (activePicker && !e.target.closest(".day-tile")) {
                closePicker();
            }
        });

        // Ekspor Gambar yang Presisi
        function generateCalendarCanvas() {
            closePicker();
            const card = document.getElementById("calendar-card");

            return html2canvas(card, { 
                scale: 2,
                useCORS: true,
                logging: false,
                onclone: (clonedDoc) => {
                    // Hapus pop-up picker dari kloningan sebelum dijadikan gambar
                    const pickers = clonedDoc.querySelectorAll(".pop-picker");
                    pickers.forEach(el => el.remove());
                }
            });
        }

        function downloadCalendar() {
            generateCalendarCanvas().then(canvas => {
                const link = document.createElement('a');
                link.download = `Jadwal_Les_${monthNames[currentMonth]}_${currentYear}.png`;
                link.href = canvas.toDataURL("image/png");
                link.click();
            });
        }

        async function shareToWhatsApp() {
            const canvas = await generateCalendarCanvas();
            
            canvas.toBlob(async (blob) => {
                const file = new File([blob], `Jadwal_Les_${monthNames[currentMonth]}.png`, { type: 'image/png' });

                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({
                            files: [file],
                            title: 'Jadwal Les',
                            text: `Berikut jadwal pertemuan les untuk bulan ${monthNames[currentMonth]} ${currentYear}.`
                        });
                    } catch (err) {
                        console.log("Share dibatalkan/gagal", err);
                    }
                } else {
                    downloadCalendar();
                    const text = encodeURIComponent(`Halo, berikut jadwal pertemuan les untuk bulan ${monthNames[currentMonth]} ${currentYear}.\n\n*(Gambar kalender telah ter-download otomatis, silakan lampirkan gambar tersebut di pesan ini)*`);
                    window.open(`https://api.whatsapp.com/send?text=${text}`, '_blank');
                }
            }, 'image/png');
        }
    </script>
</body>
</html>
