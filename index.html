<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- RESPONSIVE VIEWPORT: Memastikan ukuran web disesuaikan dengan layar HP/Laptop, cegah auto-zoom berlebih -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalender - Laporan</title>

    <!-- DEPENDENSI EXTERNAL -->
    <!-- Tailwind CSS (CDN): Framework CSS berbasis utility class untuk styling cepat -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html2canvas: Library JS untuk merubah elemen DOM/HTML menjadi gambar Canvas/PNG -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        /* CSS NATIVE / CUSTOM STYLE RULES */
        body {
            /* Sistem Font bawaan OS (Apple/Windows/Android) agar terlihat native dan bersih */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6; /* Warna latar belakang fallback (Gray 100) */
        }

        /* Container untuk tiap tanggal di kalender */
        .day-container {
            position: relative; /* Menjadi patokan letak absolute untuk pop-picker (color palette) */
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;

            /* MENCEGAH TEKS TERSELEKSI ATAU MENAMPILKAN POPUP MENU SAAT DI-TAP/TAHAN DI HP */
            -webkit-touch-callout: none !important; /* Matikan menu panggil iPhone/Safari */
            -webkit-user-select: none !important;   /* Matikan seleksi teks */
            user-select: none !important;
            touch-action: none !important;          /* Matikan gesture bawaan browser (seperti scroll/pinch) khusus di elemen tanggal */
        }

        /* SVG Lingkaran Tanggal */
        .day-svg {
            width: 36px;
            height: 36px;
            overflow: visible;      /* Mencegah efek shadow atau pop-up terpotong di batas lingkaran */
            pointer-events: none;  /* Supaya event klik menembus SVG dan langsung mengenai .day-container */
        }

        /* Pop-up pemilih warna highlight */
        .pop-picker {
            touch-action: auto !important;    /* Mengembalikan respon sentuhan standar untuk picker */
            pointer-events: auto !important; /* Mengaktifkan klik/tap pada tombol warna */
        }

        .color-btn {
            touch-action: manipulation !important; /* Optimasi respon tap di HP agar cepat tanpa delay 300ms */
            pointer-events: auto !important;
        }
    </style>
</head>

<!-- TAILWIND UTILITY LAYOUT UTAMA:
     flex flex-col : Memposisikan anak elemen secara vertikal (kolom)
     items-center justify-center : Memposisikan konten pas di tengah layar (horizontal & vertikal)
     min-h-screen : Tinggi minimal 100% layar HP/Monitor
     p-4 : Padding (jarak dalam) 1rem / 16px
-->

<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <!-- CARD CONTAINER UTAMA -->
    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-6 border border-gray-100">
        
        <!-- TARGET CAPTURE: Dikunci tingginya (h-[440px]) dan memakai Flexbox agar presisi bebas hentakan -->
        <div id="calendar-card" class="bg-white p-4 rounded-xl flex flex-col justify-between h-[440px]">
            
            <!-- HEADER JUDUL BULAN & NAVIGASI -->
            <div class="flex items-center justify-between mb-2">
                <button id="btn-prev-month" type="button" title="Bulan Sebelumnya" class="p-2 rounded-xl hover:bg-gray-100 text-gray-600 transition-colors active:scale-95">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path>
                    </svg>
                </button>
                
                <h2 id="month-year-title" class="text-xl font-bold text-gray-800"></h2>
                
                <button id="btn-next-month" type="button" title="Bulan Berikutnya" class="p-2 rounded-xl hover:bg-gray-100 text-gray-600 transition-colors active:scale-95">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path>
                    </svg>
                </button>
            </div>

            <!-- HEADER NAMA HARI (Grid 7 Kolom) -->
            <div class="grid grid-cols-7 text-center font-medium text-gray-700 text-xs sm:text-sm my-2 justify-items-center">
                <div><span class="sm:hidden">Min</span><span class="hidden sm:block">Minggu</span></div>
                <div><span class="sm:hidden">Sen</span><span class="hidden sm:block">Senin</span></div>
                <div><span class="sm:hidden">Sel</span><span class="hidden sm:block">Selasa</span></div>
                <div><span class="sm:hidden">Rab</span><span class="hidden sm:block">Rabu</span></div>
                <div><span class="sm:hidden">Kam</span><span class="hidden sm:block">Kamis</span></div>
                <div><span class="sm:hidden">Jum</span><span class="hidden sm:block">Jumat</span></div>
                <div><span class="sm:hidden">Sab</span><span class="hidden sm:block">Sabtu</span></div>
            </div>

            <!-- CONTAINER DATES: flex-1 untuk mengisi sisa ruang, sel otomatis merenggang presisi -->
            <div id="calendar-days" class="grid grid-cols-7 flex-1 w-full text-center text-gray-800 text-sm font-medium justify-items-center items-center">
            </div>
        </div>

        <!-- FOOTER / KONTROL AKSES -->
        <div class="mt-6 border-t border-gray-100 pt-4 flex flex-col gap-3">
            <div class="flex w-full items-center gap-2 relative">
                
                <!-- CUSTOM DROPDOWN CONTAINER -->
                <div class="w-[80%] relative">
                    <button id="custom-dropdown-btn" type="button" class="w-full bg-gray-100/80 hover:bg-gray-200/80 text-gray-800 font-semibold py-2.5 px-3.5 rounded-xl text-sm flex items-center justify-between transition-all duration-200 border border-transparent focus:border-gray-300 focus:bg-white focus:shadow-sm">
                        <span id="dropdown-label" class="truncate">Zafi</span>
                        <svg id="dropdown-arrow" class="w-4 h-4 text-gray-500 transition-transform duration-200" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </button>

                    <div id="custom-dropdown-menu" class="hidden absolute left-0 right-0 bottom-full mb-2 bg-white/95 backdrop-blur-md border border-gray-100 shadow-2xl rounded-xl p-1.5 z-50 transition-all duration-200 opacity-0 scale-95 transform origin-bottom">
                        <div class="text-[10px] font-bold text-gray-400 uppercase tracking-wider px-3 py-1.5">Nama Murid</div>
                        <ul id="student-list-options" class="flex flex-col gap-0.5">
                            <li data-value="Arka" class="student-option px-3 py-2.5 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-100 cursor-pointer flex items-center justify-between transition-colors">
                                <span>Arka</span>
                                <svg class="check-icon w-4 h-4 text-gray-800 hidden" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
                            </li>
                            <li data-value="Zafi" class="student-option px-3 py-2.5 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-100 cursor-pointer flex items-center justify-between transition-colors">
                                <span>Zafi</span>
                                <svg class="check-icon w-4 h-4 text-gray-800 hidden" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
                            </li>
                            <li data-value="Jidan" class="student-option px-3 py-2.5 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-100 cursor-pointer flex items-center justify-between transition-colors">
                                <span>Jidan</span>
                                <svg class="check-icon w-4 h-4 text-gray-800 hidden" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
                            </li>
                        </ul>
                    </div>
                </div>

                <!-- TOMBOL BAGIKAN / SALIN -->
                <button id="btn-copy" title="Bagikan / Salin Gambar" class="w-[20%] h-[42px] bg-gray-100/80 hover:bg-gray-200/80 text-gray-700 font-semibold rounded-xl flex items-center justify-center transition duration-200 active:scale-95">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- NOTIFIKASI TOAST -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-lg transition-all duration-300 opacity-0 pointer-events-none z-50 flex items-center gap-2">
        <span>Memproses gambar...</span>
    </div>

    <!-- SCRIPT 1: RENDER DYNAMIC GRID KALENDER -->
    <script>
        const date = new Date();
        window.currentYear = date.getFullYear();
        window.currentMonth = date.getMonth();

        const monthNames = [
            "Januari", "Februari", "Maret", "April", "Mei", "Juni", 
            "Juli", "Agustus", "September", "Oktober", "November", "Desember"
        ];

        function createDaySvg(dayNumber, isCurrentMonth = true, cellKey = "") {
            const dayWrapper = document.createElement("div");
            // Menambahkan flex items-center & justify-center agar ikon/angka presisi di tengah sel
            dayWrapper.className = "day-container cursor-pointer select-none relative transition-all duration-300 ease-in-out transform flex items-center justify-center w-full h-full";

            const svgNS = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("viewBox", "0 0 36 36");
            svg.setAttribute("class", "day-svg w-9 h-9 sm:w-10 sm:h-10");

            const circle = document.createElementNS(svgNS, "circle");
            circle.setAttribute("cx", "18");
            circle.setAttribute("cy", "18");
            circle.setAttribute("r", "17");
            circle.setAttribute("fill", "transparent");
            circle.setAttribute("class", "transition-colors duration-150");

            const text = document.createElementNS(svgNS, "text");
            text.setAttribute("x", "18");
            text.setAttribute("y", "23");
            text.setAttribute("text-anchor", "middle");
            text.setAttribute("font-size", "14");
            text.setAttribute("font-weight", isCurrentMonth ? "500" : "400");
            text.setAttribute("fill", isCurrentMonth ? "#1f2937" : "rgba(31, 41, 55, 0.35)");
            text.textContent = dayNumber;

            svg.appendChild(circle);
            svg.appendChild(text);
            dayWrapper.appendChild(svg);

            return { dayWrapper, circle, text, isCurrentMonth };
        }

        window.renderCalendarGrid = function(year, month) {
            document.getElementById("month-year-title").innerText = `${monthNames[month]} ${year}`;
            const calendarDaysContainer = document.getElementById("calendar-days");
            calendarDaysContainer.innerHTML = ""; 

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();
            const prevLastDay = new Date(year, month, 0).getDate();

            window.dayElements = {};

            // Hitung total sel & baris secara presisi
            const totalRenderedSoFar = firstDayIndex + totalDays;
            const targetTotalCells = totalRenderedSoFar > 35 ? 42 : 35;
            const rowCount = targetTotalCells / 7;

            // Kunci grid row fraction secara dinamis di container
            calendarDaysContainer.style.gridTemplateRows = `repeat(${rowCount}, minmax(0, 1fr))`;

            // 1. Tanggal Bulan Lalu
            for (let x = firstDayIndex; x > 0; x--) {
                const prevDayNum = prevLastDay - x + 1;
                const cellKey = `prev_${prevDayNum}`;
                const { dayWrapper, circle, text, isCurrentMonth } = createDaySvg(prevDayNum, false, cellKey);
                window.dayElements[cellKey] = { circle, text, wrapper: dayWrapper, isCurrentMonth };
                calendarDaysContainer.appendChild(dayWrapper);
            }

            // 2. Tanggal Bulan Ini
            for (let day = 1; day <= totalDays; day++) {
                const cellKey = `${day}`;
                const { dayWrapper, circle, text, isCurrentMonth } = createDaySvg(day, true, cellKey);
                window.dayElements[cellKey] = { circle, text, wrapper: dayWrapper, isCurrentMonth };
                calendarDaysContainer.appendChild(dayWrapper);
            }

            // 3. Tanggal Bulan Depan
            const nextDaysCount = targetTotalCells - totalRenderedSoFar;

            for (let j = 1; j <= nextDaysCount; j++) {
                const cellKey = `next_${j}`;
                const { dayWrapper, circle, text, isCurrentMonth } = createDaySvg(j, false, cellKey);
                window.dayElements[cellKey] = { circle, text, wrapper: dayWrapper, isCurrentMonth };
                calendarDaysContainer.appendChild(dayWrapper);
            }
        };

        window.renderCalendarGrid(window.currentYear, window.currentMonth);
    </script>

    <!-- SCRIPT 2 (MODULE Firebase & Events tetap seperti semula) -->
    <!-- ... Tetap sertakan Script 2 milik Anda di bawah ini ... -->
</body>
</html>
