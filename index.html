<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Pertemuan Les</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html2canvas untuk mengubah HTML menjadi Gambar -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
        }

        /* 
         * FIX PERGESERAN RENDERING CANVAS (CRITICAL FIX):
         * html2canvas sering salah menghitung posisi angka jika menggunakan Flexbox centering (flex items-center justify-center).
         * Sebagai gantinya, kita paksa elemen tanggal berukuran pasti (fixed size) 
         * dan menggunakan 'line-height' yang identik dengan tingginya untuk meratakan teks persis di tengah secara vertikal.
         */
        .day-tile {
            width: 36px !important;
            height: 36px !important;
            line-height: 36px !important;
            text-align: center !important;
            display: inline-block !important;
            border-radius: 9999px !important; /* Membuat bentuk lingkaran sempurna */
            box-sizing: border-box !important;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <!-- Container Utama -->
    <div class="w-full max-w-md bg-white rounded-xl shadow-md p-6 border border-gray-100">
        
        <!-- Area Kalender yang Akan Dijadikan Gambar/Di-share -->
        <div id="calendar-card" class="bg-white p-4 rounded-xl">
            <!-- Judul Bulan & Tahun -->
            <h2 id="month-year-title" class="text-xl font-bold text-gray-800 mb-6"></h2>

            <!-- Header Hari (Minggu - Sabtu) -->
            <div class="grid grid-cols-7 text-center font-medium text-gray-700 text-xs sm:text-sm mb-4 justify-items-center">
                <div>
                    <span class="sm:hidden">Min</span>
                    <span class="hidden sm:block">Minggu</span>
                </div>
                <div>
                    <span class="sm:hidden">Sen</span>
                    <span class="hidden sm:block">Senin</span>
                </div>
                <div>
                    <span class="sm:hidden">Sel</span>
                    <span class="hidden sm:block">Selasa</span>
                </div>
                <div>
                    <span class="sm:hidden">Rab</span>
                    <span class="hidden sm:block">Rabu</span>
                </div>
                <div>
                    <span class="sm:hidden">Kam</span>
                    <span class="hidden sm:block">Kamis</span>
                </div>
                <div>
                    <span class="sm:hidden">Jum</span>
                    <span class="hidden sm:block">Jumat</span>
                </div>
                <div>
                    <span class="sm:hidden">Sab</span>
                    <span class="hidden sm:block">Sabtu</span>
                </div>
            </div>

            <!-- 
                GRID TANGGAL:
                Menambahkan 'justify-items-center' agar setiap item tanggal diposisikan tepat 
                di tengah grid-cell masing-masing tanpa mengandalkan 'mx-auto' pada child-element.
            -->
            <div id="calendar-days" class="grid grid-cols-7 gap-y-3 text-center text-gray-800 text-sm font-medium justify-items-center">
                <!-- Tanggal di-generate otomatis oleh JS -->
            </div>
        </div>

        <!-- Panel Kontrol Aksi (Tidak Masuk ke dalam Gambar) -->
        <div class="mt-6 border-t pt-4 flex flex-col gap-3">
            <p class="text-xs text-gray-500 text-center">Klik tanggal untuk highlight. Tahan klik (long-press) untuk opsi warna.</p>

            <button onclick="shareToWhatsApp()" class="w-full bg-green-500 hover:bg-green-600 text-white font-semibold py-2.5 px-4 rounded-lg flex items-center justify-center gap-2 transition duration-200">
                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                    <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.705 1.754zm6.097-4.148l.377.224c1.474.874 3.167 1.335 4.891 1.337 5.207 0 9.444-4.237 9.447-9.445.002-2.523-.979-4.894-2.76-6.677-1.782-1.782-4.155-2.763-6.678-2.764-5.208 0-9.444 4.237-9.446 9.446-.001 1.831.523 3.617 1.517 5.176l.248.389-1.006 3.674 3.76-.986z"/>
                </svg>
                Bagikan ke WhatsApp
            </button>

            <button onclick="downloadCalendar()" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-2 px-4 rounded-lg flex items-center justify-center gap-2 transition duration-200 text-sm">
                📥 Download Gambar Kalender
            </button>
        </div>
    </div>

    <script>
        /**
         * =========================================================================
         * PENJELASAN INTEGRASI UX & OPTIMASI KANVAS (PRESET PERSISI BERSAMA HTML2CANVAS)
         * =========================================================================
         * Masalah Utama Gambar Tidak Presisi:
         * 1. html2canvas kesulitan menerjemahkan Flexbox dinamik (`flex items-center justify-center`) 
         *    sehingga baseline teks dan background lingkaran sering offset (geser beberapa piksel).
         * 2. Keberadaan elemen melayang yang memiliki CSS `position: absolute` (Pop-up Color Picker) 
         *    walau disembunyikan tetap merusak kalkulasi koordinat DOM oleh pustaka ekspor.
         *
         * Solusi yang Diterapkan:
         * 1. Mengganti Flexbox tanggal menjadi CSS Klasik (`display: inline-block` + `line-height`).
         * 2. Menggunakan Fitur 'onclone' bawaan html2canvas untuk MENULIS ULANG (Membuang) 
         *    semua DOM Pop-up Picker sebelum canvas dirender. Hasilnya, gambar murni hanya kalender bersih.
         * =========================================================================
         */

        const date = new Date();
        const currentYear = date.getFullYear();
        const currentMonth = date.getMonth();

        const monthNames = [
            "Januari", "Februari", "Maret", "April", "Mei", "Juni", 
            "Juli", "Agustus", "September", "Oktober", "November", "Desember"
        ];

        document.getElementById("month-year-title").innerText = `${monthNames[currentMonth]} ${currentYear}`;
        const calendarDaysContainer = document.getElementById("calendar-days");

        const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
        const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

        let activePicker = null;
        let pressTimer = null;
        let isLongPress = false;

        const highlightColors = ["bg-emerald-200", "bg-yellow-200", "bg-rose-200", "bg-sky-200"];

        // Render cell kosong sebelum tanggal 1
        for (let x = 0; x < firstDayIndex; x++) {
            const emptyDiv = document.createElement("div");
            emptyDiv.className = "w-9 h-9"; // Samakan ukuran dengan tanggal agar grid sejajar
            calendarDaysContainer.appendChild(emptyDiv);
        }

        // Render Tanggal 1 s/d Selesai
        for (let day = 1; day <= totalDays; day++) {
            const dayDiv = document.createElement("div");
            
            /* 
             * Menerapkan class khusus '.day-tile' yang sudah diisi properti line-height 
             * agar presisi saat dikonversi html2canvas.
             */
            dayDiv.className = "relative day-tile cursor-pointer hover:bg-gray-100 transition select-none";
            dayDiv.innerText = day;

            // Template Pop-up Color Picker
            const pickerDiv = document.createElement("div");
            // Menambahkan marker kelas 'pop-picker' agar mudah diidentifikasi & dihapus saat proses ekspor gambar
            pickerDiv.className = "pop-picker hidden absolute -top-12 left-1/2 -translate-x-1/2 flex gap-1.5 p-1.5 bg-white border border-gray-200 shadow-xl rounded-full z-20 transition-all duration-150 transform scale-95 opacity-0";
            
            const colors = [
                { bg: "bg-emerald-200", dot: "bg-emerald-400" },
                { bg: "bg-yellow-200", dot: "bg-yellow-400" },
                { bg: "bg-rose-200", dot: "bg-rose-400" },
                { bg: "bg-sky-200", dot: "bg-sky-400" }
            ];

            colors.forEach(c => {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = `w-5 h-5 rounded-full ${c.dot} hover:scale-125 transition-transform duration-100 focus:outline-none`;
                
                btn.onclick = function(e) {
                    e.stopPropagation();
                    applyHighlight(dayDiv, c.bg);
                    closePicker();
                };
                pickerDiv.appendChild(btn);
            });

            dayDiv.appendChild(pickerDiv);

            // Logika Long Press (Tahan Klik)
            function startPress(e) {
                isLongPress = false;
                pressTimer = setTimeout(() => {
                    isLongPress = true;
                    openPicker(pickerDiv);
                }, 500);
            }

            function cancelPress() {
                clearTimeout(pressTimer);
            }

            dayDiv.addEventListener("mousedown", startPress);
            dayDiv.addEventListener("touchstart", startPress, { passive: true });

            dayDiv.addEventListener("mouseup", cancelPress);
            dayDiv.addEventListener("mouseleave", cancelPress);
            dayDiv.addEventListener("touchend", cancelPress);
            dayDiv.addEventListener("touchcancel", cancelPress);

            // Action Klik Biasa (Toggle Default Emerald)
            dayDiv.onclick = function(e) {
                if (e.target.closest(".pop-picker")) return;

                if (isLongPress) {
                    isLongPress = false;
                    return;
                }

                closePicker();
                applyHighlight(dayDiv, "bg-emerald-200");
            };

            calendarDaysContainer.appendChild(dayDiv);
        }

        // Fungsi Toggle Highlight
        function applyHighlight(element, targetColorClass) {
            const currentColor = highlightColors.find(color => element.classList.contains(color));

            if (currentColor === targetColorClass) {
                element.classList.remove(currentColor, "text-gray-900", "font-bold");
                element.classList.add("hover:bg-gray-100");
            } else {
                element.classList.remove(...highlightColors, "hover:bg-gray-100");
                element.classList.add(targetColorClass, "text-gray-900", "font-bold");
            }
        }

        // Kontrol Animasi Pop-up
        function openPicker(pickerEl) {
            if (activePicker && activePicker !== pickerEl) closePicker();

            activePicker = pickerEl;
            pickerEl.classList.remove("hidden");
            setTimeout(() => {
                pickerEl.classList.remove("scale-95", "opacity-0");
                pickerEl.classList.add("scale-100", "opacity-100");
            }, 10);
        }

        function closePicker() {
            if (!activePicker) return;
            const pickerEl = activePicker;
            pickerEl.classList.remove("scale-100", "opacity-100");
            pickerEl.classList.add("scale-95", "opacity-0");
            
            setTimeout(() => {
                pickerEl.classList.add("hidden");
            }, 150);
            
            activePicker = null;
        }

        document.addEventListener("click", function(e) {
            if (activePicker && !e.target.closest(".relative")) {
                closePicker();
            }
        });

        /**
         * =========================================================================
         * OPTIMASI FUNGSI KANVAS ELEMEN KALENDER (GENERATING PICTURE)
         * =========================================================================
         * Menggunakan Callback `onclone`:
         * `html2canvas` akan menduplikat elemen HTML di latar belakang sebelum memproses gambar.
         * Lewat `onclone`, kita me-remove semua elemen `.pop-picker` secara paksa dari 
         * dokumen kloningan agar tidak merusak perhitungan tata letak koordinat canvas.
         * =========================================================================
         */
        function generateCalendarCanvas() {
            closePicker();
            const card = document.getElementById("calendar-card");

            return html2canvas(card, { 
                scale: 2,           // Memperjelas kualitas resolusi gambar (Retina Ready)
                useCORS: true,       // Menghindari issue CORS jika ada resource eksternal
                logging: false,      // Mematikan log di console browser
                onclone: (clonedDoc) => {
                    // Cari dan bersihkan elemen pop-up picker dari dokumen salinan
                    const pickers = clonedDoc.querySelectorAll(".pop-picker");
                    pickers.forEach(el => el.remove());
                }
            });
        }

        // Ekspor ke Berkas Gambar (PNG)
        function downloadCalendar() {
            generateCalendarCanvas().then(canvas => {
                const link = document.createElement('a');
                link.download = `Jadwal_Les_${monthNames[currentMonth]}_${currentYear}.png`;
                link.href = canvas.toDataURL("image/png");
                link.click();
            });
        }

        // Share Fitur Berkas ke Aplikasi WhatsApp
        async function shareToWhatsApp() {
            const canvas = await generateCalendarCanvas();
            
            canvas.toBlob(async (blob) => {
                const file = new File([blob], `Jadwal_Les_${monthNames[currentMonth]}.png`, { type: 'image/png' });

                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({
                            files: [file],
                            title: 'Jadwal Les',
                            text: `Berikut jadwal pertemuan les untuk bulan ${monthNames[currentMonth]} ${currentYear}.`
                        });
                    } catch (err) {
                        console.log("Share dibatalkan/gagal", err);
                    }
                } else {
                    downloadCalendar();
                    const text = encodeURIComponent(`Halo, berikut jadwal pertemuan les untuk bulan ${monthNames[currentMonth]} ${currentYear}.\n\n*(Gambar kalender telah ter-download otomatis, silakan lampirkan gambar tersebut di pesan ini)*`);
                    window.open(`https://api.whatsapp.com/send?text=${text}`, '_blank');
                }
            }, 'image/png');
        }
    </script>
</body>
</html>
