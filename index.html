<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalender - Laporan</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
        }

        .day-container {
            position: relative;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;

            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            user-select: none !important;
            touch-action: none !important;
        }

        .day-svg {
            width: 36px;
            height: 36px;
            overflow: visible;
            pointer-events: none;
        }

        .pop-picker {
            touch-action: auto !important;
            pointer-events: auto !important;
        }

        .color-btn {
            touch-action: manipulation !important;
            pointer-events: auto !important;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-6 border border-gray-100">
        <div id="calendar-card" class="bg-white p-4 rounded-xl">
            <h2 id="month-year-title" class="text-xl font-bold text-gray-800 mb-6"></h2>

            <div class="grid grid-cols-7 text-center font-medium text-gray-700 text-xs sm:text-sm mb-4 justify-items-center">
                <div><span class="sm:hidden">Min</span><span class="hidden sm:block">Minggu</span></div>
                <div><span class="sm:hidden">Sen</span><span class="hidden sm:block">Senin</span></div>
                <div><span class="sm:hidden">Sel</span><span class="hidden sm:block">Selasa</span></div>
                <div><span class="sm:hidden">Rab</span><span class="hidden sm:block">Rabu</span></div>
                <div><span class="sm:hidden">Kam</span><span class="hidden sm:block">Kamis</span></div>
                <div><span class="sm:hidden">Jum</span><span class="hidden sm:block">Jumat</span></div>
                <div><span class="sm:hidden">Sab</span><span class="hidden sm:block">Sabtu</span></div>
            </div>

            <div id="calendar-days" class="grid grid-cols-7 gap-y-3 text-center text-gray-800 text-sm font-medium justify-items-center">
            </div>
        </div>

        <div class="mt-6 border-t-2 border-gray-100 pt-4 flex flex-col gap-3">
            
            <!-- KOMPONEN DROPDOWN CUSTOM & TOMBOL SALIN -->
            <div class="flex w-full items-center gap-2 relative">
                
                <!-- Custom Dropdown Container (80%) -->
                <div class="w-[80%] relative">
                    <!-- Trigger Button -->
                    <button id="custom-dropdown-btn" type="button" class="w-full bg-gray-100/80 hover:bg-gray-200/80 text-gray-800 font-semibold py-2.5 px-3.5 rounded-xl text-sm flex items-center justify-between transition-all duration-200 border border-transparent focus:border-gray-300 focus:bg-white focus:shadow-sm">
                        <span id="dropdown-label" class="truncate">Zafi</span>
                        <svg id="dropdown-arrow" class="w-4 h-4 text-gray-500 transition-transform duration-200" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </button>

                    <!-- Floating Menu Option -->
                    <div id="custom-dropdown-menu" class="hidden absolute left-0 right-0 bottom-full mb-2 bg-white/95 backdrop-blur-md border border-gray-100 shadow-2xl rounded-xl p-1.5 z-50 transition-all duration-200 opacity-0 scale-95 transform origin-bottom">
                        <div class="text-[10px] font-bold text-gray-400 uppercase tracking-wider px-3 py-1.5">Nama Murid</div>
                        <ul id="student-list-options" class="flex flex-col gap-0.5">
                            <!-- Daftar Murid -->
                             <li data-value="Arka" class="student-option px-3 py-2.5 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-100 cursor-pointer flex items-center justify-between transition-colors">
                                <span>Arka</span>
                                <svg class="check-icon w-4 h-4 text-gray-800 hidden" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
                            </li>
                            <li data-value="Zafi" class="student-option px-3 py-2.5 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-100 cursor-pointer flex items-center justify-between transition-colors">
                                <span>Zafi</span>
                                <svg class="check-icon w-4 h-4 text-gray-800 hidden" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
                            </li>
                            <li data-value="Jidan" class="student-option px-3 py-2.5 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-100 cursor-pointer flex items-center justify-between transition-colors">
                                <span>Jidan</span>
                                <svg class="check-icon w-4 h-4 text-gray-800 hidden" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
                            </li>
                        </ul>
                    </div>
                </div>

                <!-- Tombol Copy/Share Icon (20%) -->
                <button id="btn-copy" title="Bagikan / Salin Gambar" class="w-[20%] h-[42px] bg-gray-100/80 hover:bg-gray-200/80 text-gray-700 font-semibold rounded-xl flex items-center justify-center transition duration-200 active:scale-95">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-lg transition-all duration-300 opacity-0 pointer-events-none z-50 flex items-center gap-2">
        <span>Memproses gambar...</span>
    </div>

    <!-- SCRIPT SINKRONUS: Render Grid Kalender -->
    <script>
        const date = new Date();
        const currentYear = date.getFullYear();
        const currentMonth = date.getMonth();

        const monthNames = [
            "Januari", "Februari", "Maret", "April", "Mei", "Juni", 
            "Juli", "Agustus", "September", "Oktober", "November", "Desember"
        ];

        document.getElementById("month-year-title").innerText = `${monthNames[currentMonth]} ${currentYear}`;
        const calendarDaysContainer = document.getElementById("calendar-days");

        const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
        const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

        window.dayElements = {};

        for (let x = 0; x < firstDayIndex; x++) {
            const emptyDiv = document.createElement("div");
            emptyDiv.className = "w-9 h-9";
            calendarDaysContainer.appendChild(emptyDiv);
        }

        for (let day = 1; day <= totalDays; day++) {
            const dayWrapper = document.createElement("div");
            dayWrapper.className = "day-container cursor-pointer select-none";

            const svgNS = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("viewBox", "0 0 36 36");
            svg.setAttribute("class", "day-svg");

            const circle = document.createElementNS(svgNS, "circle");
            circle.setAttribute("cx", "18");
            circle.setAttribute("cy", "18");
            circle.setAttribute("r", "17");
            circle.setAttribute("fill", "transparent");
            circle.setAttribute("class", "transition-colors duration-150");

            const text = document.createElementNS(svgNS, "text");
            text.setAttribute("x", "18");
            text.setAttribute("y", "23");
            text.setAttribute("text-anchor", "middle");
            text.setAttribute("font-size", "14");
            text.setAttribute("font-weight", "500");
            text.setAttribute("fill", "#1f2937");
            text.textContent = day;

            svg.appendChild(circle);
            svg.appendChild(text);
            dayWrapper.appendChild(svg);

            window.dayElements[day] = { circle, text, wrapper: dayWrapper };
            calendarDaysContainer.appendChild(dayWrapper);
        }
    </script>

    <!-- SCRIPT MODULE: Firebase Sync & Custom Dropdown Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBs2RwkyPaIugpdFSpYWRnZK0Ry1j0OLek",
            authDomain: "share-recap.firebaseapp.com",
            projectId: "share-recap",
            storageBucket: "share-recap.firebasestorage.app",
            messagingSenderId: "1095414789864",
            appId: "1:1095414789864:web:b7feaf89a346f3aa2f7b5d",
            measurementId: "G-PEPWBTK71S"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        const colorMap = {
            "emerald": "#a7f3d0",
            "yellow":  "#fef08a",
            "rose":    "#fecdd3",
            "sky":     "#bae6fd"
        };

        // --- MANAJEMEN CUSTOM DROPDOWN ---
        const dropdownBtn = document.getElementById("custom-dropdown-btn");
        const dropdownMenu = document.getElementById("custom-dropdown-menu");
        const dropdownArrow = document.getElementById("dropdown-arrow");
        const dropdownLabel = document.getElementById("dropdown-label");
        const studentOptions = document.querySelectorAll(".student-option");

        let currentSelectedStudent = "Zafi";

        function toggleDropdown() {
            const isHidden = dropdownMenu.classList.contains("hidden");
            if (isHidden) {
                dropdownMenu.classList.remove("hidden");
                setTimeout(() => {
                    dropdownMenu.classList.remove("opacity-0", "scale-95");
                    dropdownMenu.classList.add("opacity-100", "scale-100");
                    dropdownArrow.classList.add("rotate-180");
                }, 10);
            } else {
                closeDropdown();
            }
        }

        function closeDropdown() {
            dropdownMenu.classList.remove("opacity-100", "scale-100");
            dropdownMenu.classList.add("opacity-0", "scale-95");
            dropdownArrow.classList.remove("rotate-180");
            setTimeout(() => {
                dropdownMenu.classList.add("hidden");
            }, 150);
        }

        dropdownBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            toggleDropdown();
        });

        document.addEventListener("click", (e) => {
            if (!dropdownMenu.contains(e.target) && !dropdownBtn.contains(e.target)) {
                closeDropdown();
            }
        });

        function updateDropdownUI(val) {
            currentSelectedStudent = val;
            dropdownLabel.innerText = val;

            studentOptions.forEach(opt => {
                const checkIcon = opt.querySelector(".check-icon");
                if (opt.dataset.value === val) {
                    opt.classList.add("bg-gray-100", "text-gray-900", "font-semibold");
                    checkIcon.classList.remove("hidden");
                } else {
                    opt.classList.remove("bg-gray-100", "text-gray-900", "font-semibold");
                    checkIcon.classList.add("hidden");
                }
            });
        }

        studentOptions.forEach(opt => {
            opt.addEventListener("click", () => {
                const selectedVal = opt.dataset.value;
                updateDropdownUI(selectedVal);
                closeDropdown();
                subscribeToStudentSchedule();
            });
        });

        // Ambil data murid terakhir dari localStorage
        const lastStudent = localStorage.getItem("last_selected_student");
        if (lastStudent && Array.from(studentOptions).some(o => o.dataset.value === lastStudent)) {
            updateDropdownUI(lastStudent);
        } else {
            updateDropdownUI("Zafi");
        }

        // --- SINKRONISASI FIRESTORE ---
        let scheduleData = {};
        let unsubscribeSnapshot = null;

        function subscribeToStudentSchedule() {
            if (unsubscribeSnapshot) unsubscribeSnapshot();

            localStorage.setItem("last_selected_student", currentSelectedStudent);

            const docId = `${currentYear}-${currentMonth + 1}_${currentSelectedStudent}`;
            const scheduleDocRef = doc(db, "les_schedules", docId);

            unsubscribeSnapshot = onSnapshot(scheduleDocRef, (docSnap) => {
                if (docSnap.exists()) {
                    scheduleData = docSnap.data();
                } else {
                    scheduleData = {};
                }
                renderAllHighlights();
            });
        }

        subscribeToStudentSchedule();

        // --- COLOR PICKER & HIGHLIGHT LOGIC ---
        let activePicker = null;
        let pressTimer = null;
        let isLongPress = false;

        for (let day = 1; day <= totalDays; day++) {
            const { circle, wrapper: dayWrapper } = window.dayElements[day];

            const pickerDiv = document.createElement("div");
            pickerDiv.className = "pop-picker hidden absolute -top-12 left-1/2 -translate-x-1/2 flex gap-1.5 p-1.5 bg-white border border-gray-200 shadow-xl rounded-full z-40 transition-all duration-150 transform scale-95 opacity-0";

            const preventBubble = (e) => e.stopPropagation();
            pickerDiv.addEventListener("touchstart", preventBubble, { passive: true });
            pickerDiv.addEventListener("touchend", preventBubble, { passive: true });
            pickerDiv.addEventListener("mousedown", preventBubble);
            pickerDiv.addEventListener("mouseup", preventBubble);

            const colors = [
                { key: "emerald", dot: "bg-emerald-400" },
                { key: "yellow",  dot: "bg-yellow-400" },
                { key: "rose",    dot: "bg-rose-400" },
                { key: "sky",     dot: "bg-sky-400" }
            ];

            colors.forEach(c => {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = `color-btn w-5 h-5 rounded-full ${c.dot} hover:scale-125 transition-transform duration-100 focus:outline-none`;

                const selectColor = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    toggleHighlightAndSave(day, c.key);
                    closePicker();
                };

                btn.addEventListener("pointerdown", selectColor);
                pickerDiv.appendChild(btn);
            });

            dayWrapper.appendChild(pickerDiv);

            function startPress(e) {
                if (e.target.closest(".pop-picker")) return;

                if (e.cancelable && e.type === "touchstart") {
                    e.preventDefault();
                }

                isLongPress = false;
                cancelPress();

                pressTimer = setTimeout(() => {
                    isLongPress = true;
                    openPicker(pickerDiv);
                }, 400);
            }

            function cancelPress() {
                if (pressTimer) {
                    clearTimeout(pressTimer);
                    pressTimer = null;
                }
            }

            function handleEnd(e) {
                if (e.target.closest(".pop-picker")) return;

                cancelPress();

                if (!isLongPress) {
                    closePicker();
                    toggleHighlightAndSave(day, "emerald");
                }
            }

            dayWrapper.oncontextmenu = function(e) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            };

            dayWrapper.addEventListener("touchstart", startPress, { passive: false });
            dayWrapper.addEventListener("touchend", handleEnd);
            dayWrapper.addEventListener("touchcancel", cancelPress);

            dayWrapper.addEventListener("mousedown", startPress);
            dayWrapper.addEventListener("mouseup", handleEnd);
            dayWrapper.addEventListener("mouseleave", cancelPress);
        }

        function renderAllHighlights() {
            for (let day = 1; day <= totalDays; day++) {
                const { circle, text } = window.dayElements[day];
                const colorKey = scheduleData[day];

                if (colorKey && colorMap[colorKey]) {
                    circle.setAttribute("fill", colorMap[colorKey]);
                    text.setAttribute("font-weight", "700");
                    text.setAttribute("fill", "#111827");
                } else {
                    circle.setAttribute("fill", "transparent");
                    text.setAttribute("font-weight", "500");
                    text.setAttribute("fill", "#1f2937");
                }
            }
        }

        async function toggleHighlightAndSave(day, colorKey) {
            const docId = `${currentYear}-${currentMonth + 1}_${currentSelectedStudent}`;
            const scheduleDocRef = doc(db, "les_schedules", docId);

            const currentSavedColor = scheduleData[day];

            if (currentSavedColor === colorKey) {
                delete scheduleData[day];
            } else {
                scheduleData[day] = colorKey;
            }

            try {
                await setDoc(scheduleDocRef, scheduleData);
            } catch (err) {
                console.error("Gagal menyimpan ke Firestore:", err);
                showToast("❌ Gagal menyinkronkan data.");
            }
        }

        function openPicker(pickerEl) {
            if (activePicker && activePicker !== pickerEl) closePicker();

            activePicker = pickerEl;
            pickerEl.classList.remove("hidden");
            setTimeout(() => {
                pickerEl.classList.remove("scale-95", "opacity-0");
                pickerEl.classList.add("scale-100", "opacity-100");
            }, 10);
        }

        function closePicker() {
            if (!activePicker) return;
            const pickerEl = activePicker;
            pickerEl.classList.remove("scale-100", "opacity-100");
            pickerEl.classList.add("scale-95", "opacity-0");

            setTimeout(() => {
                pickerEl.classList.add("hidden");
            }, 150);

            activePicker = null;
        }

        document.addEventListener("pointerdown", function(e) {
            if (activePicker && !e.target.closest(".day-container")) {
                closePicker();
            }
        });

        function generateCalendarCanvas() {
            closePicker();
            closeDropdown();
            const card = document.getElementById("calendar-card");

            return html2canvas(card, { 
                scale: 2,
                useCORS: true,
                logging: false,
                backgroundColor: "#ffffff",
                onclone: (clonedDoc) => {
                    const pickers = clonedDoc.querySelectorAll(".pop-picker");
                    pickers.forEach(el => el.remove());

                    const clonedCard = clonedDoc.getElementById("calendar-card");
                    if (clonedCard) {
                        clonedCard.style.backgroundColor = "#ffffff";
                    }
                }
            });
        }

        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.querySelector("span").innerText = message;

            toast.classList.remove("opacity-0", "pointer-events-none");
            toast.classList.add("opacity-100");

            setTimeout(() => {
                toast.classList.remove("opacity-100");
                toast.classList.add("opacity-0", "pointer-events-none");
            }, 2000);
        }

        // Helper Konversi Canvas ke Blob Async
        function canvasToBlobAsync(canvas, type = 'image/png') {
            return new Promise((resolve) => {
                canvas.toBlob((blob) => resolve(blob), type);
            });
        }

        // Fungsi Utama Share / Copy Gambar
        async function copyCalendarToClipboard() {
            showToast("Memproses gambar...");

            try {
                const canvas = await generateCalendarCanvas();
                const blob = await canvasToBlobAsync(canvas, 'image/png');

                if (!blob) throw new Error("Gagal membuat Blob dari gambar.");

                const fileName = `Jadwal_Les_${currentSelectedStudent}_${monthNames[currentMonth]}_${currentYear}.png`;
                const file = new File([blob], fileName, { type: 'image/png' });

                // Deteksi khusus HP/Mobile agar Web Share API TIDAK BERJALAN DI LAPTOP
                const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);

                // 1. HP / MOBILE ONLY: Pakai Native Share Sheet
                if (isMobile && navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        files: [file],
                        title: 'Jadwal Les',
                        text: `Jadwal Les ${currentSelectedStudent} (${monthNames[currentMonth]} ${currentYear})`
                    });
                    showToast("Berhasil dibagikan!");
                    return;
                }

                // 2. LAPTOP / DESKTOP ONLY: Langsung Salin ke Clipboard (Pakai Toast bawaan, tanpa pop-up)
                if (navigator.clipboard && window.ClipboardItem) {
                    try {
                        const item = new ClipboardItem({ [blob.type]: blob });
                        await navigator.clipboard.write([item]);
                        showToast("Gambar berhasil disalin!");
                        return;
                    } catch (clipboardErr) {
                        console.warn("Clipboard gagal, beralih ke unduh...", clipboardErr);
                    }
                }

                // 3. FALLBACK TERAKHIR: Auto Download
                const downloadUrl = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = fileName;
                link.href = downloadUrl;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);
                showToast("Gambar diunduh!");

            } catch (err) {
                if (err.name !== 'AbortError') {
                    console.error("Gagal memproses gambar:", err);
                    showToast("❌ Gagal memproses gambar.");
                }
            }
        }

        document.getElementById("btn-copy").addEventListener("click", copyCalendarToClipboard);
    </script>
</body>
</html>
